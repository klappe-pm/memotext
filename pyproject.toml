[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "voicememos"
dynamic = ["version"]
description = "Read the Apple Voice Memos library: find recordings, list them and extract the transcripts iOS already made."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Lappe" }]
keywords = ["voice-memos", "apple", "macos", "ios", "transcript", "m4a", "audio", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.0.3", "pytest-cov>=7"]
lint = ["ruff", "mypy"]

[project.scripts]
voicememos = "voicememos.cli:main"

[project.urls]
Homepage = "https://github.com/klappe-pm/voicememos"
Repository = "https://github.com/klappe-pm/voicememos"
Documentation = "https://github.com/klappe-pm/voicememos/blob/main/docs/README.md"
Changelog = "https://github.com/klappe-pm/voicememos/blob/main/CHANGELOG.md"
Issues = "https://github.com/klappe-pm/voicememos/issues"

[tool.hatch.version]
path = "voicememos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["voicememos"]

[tool.hatch.build.targets.sdist]
include = [
    "/voicememos",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "repo_only: reads repository files that the source distribution omits (.github, docs, the community files); skipped when they are missing",
]

[tool.coverage.run]
source = ["voicememos"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["voicememos"]
